  <!-- requestIdleCallback polyfill for Safari -->
  <script>
    window.requestIdleCallback = window.requestIdleCallback || function (cb, options) {
      var start = Date.now();
      return setTimeout(function () {
        cb({
          didTimeout: false,
          timeRemaining: function () {
            return Math.max(0, 50 - (Date.now() - start));
          }
        });
      }, options && options.timeout ? Math.min(options.timeout, 1) : 1);
    };
    window.cancelIdleCallback = window.cancelIdleCallback || function (id) {
      clearTimeout(id);
    };
  </script>

  <!-- Async script loader for non-critical resources -->
  <script type="module">
    // Async script loading utility
    function loadScript(src, options = {}) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.async = true;

        if (options.defer) script.defer = true;
        if (options.integrity) script.integrity = options.integrity;
        if (options.crossorigin) script.crossorigin = options.crossorigin;
        if (options.id) script.id = options.id;
        if (options.dataset) {
          Object.keys(options.dataset).forEach(key => {
            script.dataset[key] = options.dataset[key];
          });
        }

        script.onload = () => resolve(script);
        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));

        // Low priority for non-critical scripts
        if (options.priority === 'low') {
          script.setAttribute('data-low-priority', 'true');
          requestIdleCallback(() => {
            document.head.appendChild(script);
          });
        } else {
          document.head.appendChild(script);
        }
      });
    }

    // Load non-critical scripts asynchronously
    if ('requestIdleCallback' in window) {
      requestIdleCallback(() => {
        // Analytics - load after user interaction or delay
        const loadAnalytics = () => {
          if (!window.analyticsLoaded) {
            window.analyticsLoaded = true;
            // Future analytics scripts can be loaded here
          }
        };

        // Load analytics after 3 seconds or on first interaction
        setTimeout(loadAnalytics, 3000);
        document.addEventListener('click', loadAnalytics, { once: true });
        document.addEventListener('scroll', loadAnalytics, { once: true });
      });
    }
  </script>
